<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Retoque: DLSS 5 Neural Rendering for any game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1b2030"/>
    </linearGradient>
    <linearGradient id="before" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5163"/>
      <stop offset="1" stop-color="#2c313d"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18d2c4"/>
      <stop offset="0.55" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="760" y="60" width="440" height="200" rx="18"/>
    </clipPath>
    <clipPath id="right">
      <rect x="980" y="60" width="220" height="200"/>
