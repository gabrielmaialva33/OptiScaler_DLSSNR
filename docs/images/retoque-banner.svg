  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>

  <!-- A frame split by a comparison wipe: the game's picture on the left, the retouched one on the right. -->
  <g clip-path="url(#frame)">
    <rect x="760" y="60" width="440" height="200" fill="url(#before)"/>
    <path d="M760 228 L846 158 L904 196 L998 112 L1086 184 L1138 150 L1200 196 L1200 260 L760 260 Z" fill="#1e222c"/>
    <circle cx="1124" cy="104" r="18" fill="#8a91a3"/>
    <g clip-path="url(#right)">
      <rect x="980" y="60" width="220" height="200" fill="url(#after)"/>
      <path d="M760 228 L846 158 L904 196 L998 112 L1086 184 L1138 150 L1200 196 L1200 260 L760 260 Z" fill="#0b0d14" opacity="0.55"/>
      <path d="M998 112 L1022 133 L1010 130 L1000 141 L990 128 L980 129 Z" fill="#ffffff" opacity="0.9"/>
      <circle cx="1124" cy="104" r="18" fill="#fff4d6"/>
    </g>
  </g>
  <rect x="760" y="60" width="440" height="200" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="980" y1="46" x2="980" y2="274" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="980" cy="160" r="17" fill="#ffffff"/>
  <path d="M968 160 L975 154 L975 166 Z M992 160 L985 154 L985 166 Z" fill="#1b2030"/>

  <text x="96" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="700" fill="#ffffff" letter-spacing="-1">Retoque</text>
  <text x="100" y="222" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#b4bccc">DLSS 5 Neural Rendering for any game</text>
  <text x="100" y="262" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#76819a">Linux and Windows · built on OptiScaler</text>
