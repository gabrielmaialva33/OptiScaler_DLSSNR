# Test suite registry for tests/run_all.py.
#
# One entry per directory under tests/. Adding a suite means adding its entry
# here as well, otherwise run_all.py reports it as unregistered and fails.
#
# tier
#   host   Self-contained: a Linux C++ toolchain and Python are enough.
#          Safe to run in parallel; each suite builds into its own temp dir.
#   wine   Needs the msvc-wine prefix, and for vulkan-overlay a graphical
#          session with a working Vulkan loader. Run serially: these contend
#          for the single Wine prefix (see the build window note in CLAUDE.md).
#   wip    Registered but has no run.py yet. Always reported as skipped.
#
# timeout is in seconds and is a ceiling, not an expectation.

[nr-before-upscale]
tier = "host"
timeout = 300
summary = "Pre-upscale boundary functions against strict host fakes, under ASan/UBSan."

[nr-render-size]
tier = "host"
timeout = 60
summary = "Render size resolution: subrect handling and Width/Height fallback when subrect is absent."

[nr-exposure-latch]
tier = "host"
timeout = 60
summary = "Exposure plausibility latch (WhitePointSource=1): out-of-range readings, swinging window, reset, and white-point fallback."

[nr-invariants]
tier = "host"
timeout = 120
summary = "DEVELOPMENT.md section 4 guards: config round-trip, struct == cbuffer, headers == bytecode, retired identifiers."

[nr-zero-guides]
tier = "host"
timeout = 300
summary = "Zero depth/motion for a caller with no engine buffers, and the two-heap clear contract."

[nr-present-host]
tier = "host"
timeout = 300
summary = "What the present host builds and when: tiny frames, resizes, the pass switched off; HDR swapchains declined, or with HdrPresent converted (the decision table, the D3D12 route's per-window colour record, the bridge's decode and encode with every resource state tracked)."

[nr-session-guard]
tier = "host"
timeout = 60
summary = "Session guard: the policy table (early, middle, long unclean ends), marker ownership, unreadable and read-only cases, config-off, plus call-site guards."

[nr-dx11-route]
tier = "host"
timeout = 60
summary = "D3D11 DLSS with NR on: dlss_12 chosen when Dx11Upscaler is unset, native D3D11 DLSS reported once and shown while it runs."

[nr-present-boundary]
tier = "host"
timeout = 60
summary = "The present pass under the game's own DLSS-G (DlssNr_PresentBoundary.h): HookMethod=2 declines on the entry below DLSS-G, Auto stays upscaled for the session, HookMethod=1 and OptiScaler's own FG untouched; source guards that both routes decide through it."

[nr-present-sync]
tier = "host"
timeout = 60
summary = "PresentSync=auto: the D3D12 present pass waits for its write-back only when frame generation could be involved."

[nr-uimask-rule]
tier = "host"
timeout = 300
summary = "The HUD-protection mask's per-pixel rule, the header the shader runs, over synthetic sequences: a glyph over a pan is protected, still scenery beside a moving silhouette is not."

[nr-periphery]
tier = "host"
timeout = 300
summary = "Peripheral compression's layout and mapping, the header the shader runs: extents and refusals, inverse, monotone, no kink at either join, whole-texel centre at 100, the uniform path (guide reads and mode 2), the colour pack's weights and conservation, motion in frame pixels; the constant block held to the cbuffer."

[nr-gpu-timing]
tier = "host"
timeout = 300
summary = "Portable timing validation plus the duplicate-execution guard at the submission boundary; the HDR present conversion's own sample."

[nr-dispatch]
tier = "host"
timeout = 300
summary = "Production composition dispatch, constant-buffer ring isolation and partial initialization cleanup."

[nr-gpu-timing-config]
tier = "host"
timeout = 300
summary = "Config GPU-timing transactions and the INI expressions that back them."

[nr-log-rate]
tier = "host"
timeout = 300
summary = "Production NR log rate limiter against injected time points, and the four drift call sites that gate on it."

[nr-localization]
tier = "host"
timeout = 600
summary = "The real portable .lang parser and the repository ImGui hash."

[nr-menu]
tier = "host"
timeout = 300
summary = "Pass-menu control flow driven by scripted ImGui events."

[nr-multipass]
tier = "host"
timeout = 300
summary = "Portable multi-pass chain helpers."

[nr-pass-config]
tier = "host"
timeout = 300
summary = "Pass-settings codec and the four-point Config round trip for the master keys."

[nr-submission]
tier = "host"
timeout = 300
summary = "Command-list submission lifetime model that gates resource release."

[nr-vk-extensions]
tier = "host"
timeout = 300
summary = "The NR Vulkan device-extension merge, compiled against the real Vulkan headers: KHR and EXT buffer_device_address never leave it together."

[nr-vk-present-host]
tier = "host"
timeout = 120
summary = "The Vulkan present host, stages 1 to 3: the registry, transport and cold-NR headers (records with ids of their own, reused handles, devices side by side, the lines; the usage plan, the route, the ring, the counters; the colour plan, the device extensions and bufferDeviceAddress, the model's counters) and the one-owner arbiter under ASan/UBSan, plus source guards: one gated call site ahead of the marker check; only a swapchain's usage, a present's waits and a device's extensions edited; no refusal after a wait is spent; locks in order; a model frame counted on submit, seen complete on a fence, freed only idle; drains before frees."

[nr-shutdown]
tier = "host"
timeout = 300
summary = "Production NGX core shutdown ABI adapter, output storage, result propagation and null-device routing."

[nr-timing-boundary]
tier = "host"
timeout = 300
summary = "Timing metadata and UI boundary, plus placement of the timing markers."

[nr-cadence]
tier = "host"
timeout = 300
summary = "Model cadence: the production scheduler (age in presents the pass ran at, held reset, forced model frames, every refusal and its reason, off allocates nothing, smoothing's decisions) and the production per-pixel rules over synthetic sequences (still scene exact, pans, an occluder restarting the chain, no match no fill, the smoothing walk and light limiter), plus source guards on the pass."

[nr-enlarge]
tier = "host"
timeout = 300
summary = "Transfer 2 (private DLSS SR enlargement): the decision table, the carrier through FP16, the NGX adapter against a recording core, and production's plan/enlarge/retire/retry sliced out of DlssNr_Dx12.cpp against D3D12 fakes that chain every barrier. No GPU or NGX."

[nr-capture]
tier = "host"
timeout = 300
summary = "The comparison capture's pure half: PNG (stored deflate, CRC, Adler, tEXt) and PFM decoded with Python's zlib and checked pixel by pixel against the readback-shaped source, every half and small float, the request/record/ticket/hand-off state machine over a fake backend (nothing read before completion, never freed unproven), the menu button table, names and the 64-pair cap, the record and the privacy patterns, plus source guards on the pass."

[nr-gpu-timing-d3d12]
tier = "wine"
timeout = 1800
summary = "Real D3D12 timestamp queries in an isolated Wine prefix. Never loads NGX or a game."

[vulkan-overlay]
tier = "wine"
timeout = 1800
summary = "Builds a real DLL and drives real Vulkan to exercise overlay lifetime under Wine."

[vulkan-present-host]
tier = "wine"
timeout = 1800
summary = "The production DLL (x64/out) under a Win32 Vulkan application and Wine, synchronization validation on with zero errors: with [DlssNr] VulkanPresentHost on, under the marker, SkipHooks, and beside the bundle with the Vulkan menu off and on, the round trip's lines are held against the application's own facts (same-queue and cross-family routes, 0/1/2 waits, a ring overfilled behind GPU work, usage edits, recreation, resize, device teardown) and every presented image reads back unchanged; a surface hiding TRANSFER_SRC keeps it observe-only; with the key or the master off, no host line and, under the marker, vulkan-1.dll's exports byte-identical. A D3D11 and a D3D12 title through a local Proton's DXVK and vkd3d-proton: every present carried. Stage 3 under Proton with the real model: cold NR on every SDR present (BGRA8 UNORM and sRGB, cross-family, an unaligned extent, working scale 0.5), exact read-backs with ApplyModel off and changed ones with it on; refused for a device without the NVX extensions, an old forwarder, no model (SKIP without the kit or a local Proton)."

[dlssnr-loopback]
tier = "wine"
timeout = 600
summary = "Drives the production NGX exports on a real D3D12 device and exercises the post-stage settling gate by sweeping the output extent. Runs under the local Proton (--runtime proton); bare wine reaches NR but its feature create returns FAIL_PlatformError. Includes successful shutdown and rejects runs without NR composition."

[synth-motion-d3d12]
tier = "wine"
timeout = 1800
summary = "The synthesized-motion estimator (FidelityFX optical flow port) on a real D3D12 device under Wine: endpoint error against known pans, a moving object, static and cut frames, abandon semantics, the axis signs and GPU time; synthesized FG's HUD mask and the UI layer's own mask on the same frames (no scenery marked, precision and recall per element and part, the band around the overlay and the smear set it covers, depth and layer exact, GPU time with the layer off and on); --source nvofa runs the NVIDIA Optical Flow source the same way (SKIP when unavailable). Never loads NGX or a game."

[bridge-lifetime]
tier = "host"
timeout = 300
summary = "Production D3D11/D3D12 swapchain and upscaler fence waits, initialization, failed submissions, resize preflight, a refused presenter resize and its recovery, the D3D12 overlay's render-target release, ownership and retirement, and a second swapchain taking the window over (the surrender, Present, resizes, fullscreen and release after it), under scripted COM/Win32 fakes."

[bridge-window]
tier = "host"
timeout = 120
summary = "The bridge's window takeover header: live bridges by window (newest first, never a count at zero, the lock acquire runs under), the presenter gate against its race, and the takeover sequence (only on E_ACCESSDENIED, one release, one retry)."

[vulkan-query-readiness]
tier = "host"
timeout = 300
summary = "Production Vulkan GPU timer (GpuTime_Vk, owned by every Shader_Vk since upstream e199fac4 replaced UpscalerTime_Vk): three-pair ring, nonblocking NOT_READY retry, no publication on error, single consumption, pool lifetime, under scripted API fakes. No frame-identity or GPU synchronization coverage."

[fg-synth-policy]
tier = "host"
timeout = 300
summary = "Synthesized FG's policy (fast-motion response on incoherent motion and its cap, low-fps floor, duplicate-present advice, the HUD keys), its motion statistics, and the NR/FG motion handoff, from the production headers; the HUD mask's thresholds held equal to DLSS-NR's; the UI layer's own mask on the CPU over fixtures (a HUD over a pan taken whole; a swaying silhouette, a moving patch, rain and an edge along the motion not)."

[mfg-pattern]
tier = "host"
timeout = 300
summary = "The real MFG byte signatures and the real scanner matcher against synthetic cmp/mov buffers: each architecture signature matches its cmp-against-0x1b0 site and rejects a mov of the same immediate; both wrapper clamp shapes (r8d, and the edx one of Streamline 2.7.3 to 2.14) match; a gate rewritten to another constant falls through to the foreign patterns. Runs no patcher and touches no DLL."

[mfg-patch-plan]
tier = "host"
timeout = 300
summary = "The MFG unlock's write half (MfgPatchPlan.h) over a fake module with injected failures: a patch group commits whole or rolls back whole, a half-written site is restored, a wrong read-back rolls back, a site changed since planning writes nothing, a failed restore is reported and does not stop the others."

[nr-model-loader]
tier = "host"
timeout = 300
summary = "The NR model loaders' byte-level decisions against synthetic PE64 images (the model's GetModuleFileNameW/A import slots, the NGX loader's feature-18 table), the 616.64 faulting-pairing predicate and driver numbering; the direct runtime held to the forwarder's parameter writes, model calls and fault filter; and, when present on the machine, the real wine _nvngx.dll and nvngx_dlssnr.dll. Runs no model and no NGX."

[sl-log-repeat]
tier = "host"
timeout = 120
summary = "The Streamline log repeat filter against the real setDynamicMFGParams line on a fake clock: one line per 10 s with the folded count, new sites at once, a bounded table that fails open."

[nr-kernel-profile]
tier = "host"
timeout = 120
summary = "DLSS-NR NvAPI CUDA kernel classification by prefix, FP8 variant detection, and timing aggregation."

[nr-detail-measure]
tier = "host"
timeout = 120
summary = "The Measure detail CPU tile reduction and statistical aggregation (flicker, detail, saturation, shadows)."

[nr-residual-limit]
tier = "host"
timeout = 120
summary = "The residual limit, the composition's own bound sliced out of dlssnr.hlsl and held against the guard alone (off is the guard to the bit; on bounds both ways in stops, only narrows, stays inside the guard), the host's clamp, and where the constant is read, set, logged and shown."

[nr-pulse-metric]
tier = "host"
timeout = 120
summary = "The pulse metric's CPU half (edit light from the grid, consecutive frames paired into light steps by kind, windows, reset, words, log rate, a synthetic cadence's pulse) and source guards on its pass: off builds and records nothing, one sample per present."

[nr-hdr-math]
tier = "host"
timeout = 120
summary = "The HDR present conversion's maths, the shader's own block sliced out of dlssnr_present_hdr.hlsl and held to a float64 reference: every PQ code round-trips, untouched HDR10 and scRGB texels come back bit for bit through FP16 and the composition, an edit within one code, constants and matrices against the BT.709/BT.2020 primaries, plus source guards on the pass and both hosts."

[nr-present-guides]
tier = "host"
timeout = 120
summary = "Present-time guide snapshot ring selection, completion tracking, and cross-queue deadlock avoidance."

[nr-present-guide-identity]
tier = "host"
timeout = 120
summary = "Present-guide identity, step 0 (log only): every rule of the decision header alone and in order, narrowing only, null swapchain stamps, ring scenarios, the window and its line, the glue sliced from the renderer, and guards that both consumers still read today's slot."

[repo-privacy]
tier = "host"
timeout = 60
summary = "No home path, LAN or tailnet address, or token in any tracked file outside vendored code; every pattern self-tested."

[deploy-safety]
tier = "host"
timeout = 120
summary = "tools/deploy-to-game.sh on fake game directories: refuses while a process maps the directory, on a foreign or case-variant DLL, and on a second OptiScaler proxy; Keep-ReShade with the ini key replaced, never duplicated; receipt, partial receipt, dry run, and uninstall back to the prior state."

[windows-installer]
tier = "host"
timeout = 900
summary = "tools/install-windows.ps1 on fake game folders in a pinned PowerShell 7.4 container (or a local pwsh): the deploy-safety refusals, receipt, partial receipt, dry run and uninstall, receipts crossing to and from deploy-to-game.sh, the model never touched; static ASCII/CRLF/packager checks always. SKIP for the cases without docker or pwsh."

[lsfg-shader-library]
tier = "host"
timeout = 60
summary = "Runtime LSFG shader library: DLL discovery (Steam VDF, Wine Z:, override), PE RT_RCDATA SPIR-V extraction, and hash-keyed cache; convert.py Float16 detection (ids 51..98 on the real DLL)."

[lsfg-integration]
tier = "host"
timeout = 120
summary = "LSFG as FSR-FG's interpolator (study branch): DXIL PSV0 reader, LSFG 3.1 pass graph, cbuffer table, frame refusals, history schedule, [LSFG] four-point round trip, FSRFG_Dx12 call sites as a set; the user's own 99 modules when LSFG_DXIL_DIR is set."

[lsfg-presenter]
tier = "host"
timeout = 120
summary = "LSFG at x3/x4 through the fork of FFX's swapchain (study branch): MfgPacing.h arithmetic under ASan/UBSan (x2 delta equals FFX's, output sets, steady-state schedule, summary), and source guards on the FSRFG routing, the router's forwarding, no FFX interface on the fork, drain-before-free, MIT notices, verbatim bytecode."
