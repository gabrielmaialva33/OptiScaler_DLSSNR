summary = "The Vulkan synthesized-motion estimator (SynthMotion_Vk, the same FidelityFX port compiled to SPIR-V) on a real Vulkan device under Wine with the validation layer's core and synchronization checks: the D3D12 suite's sequences, scores and thresholds (pans and axis signs, a moving object, static, a cut, an abandoned recording, the static overlay), GPU time, and zero validation errors. SKIP when the device cannot run it. Never loads NGX or a game."

